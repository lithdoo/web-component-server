<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>code-editor ↔ lsp-ws-server</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 0.5rem 1rem;
        border-bottom: 1px solid #ccc;
        font-size: 0.9rem;
      }
      #editor-wrap {
        flex: 1;
        min-height: 0;
        padding: 0.5rem;
      }
      code-editor {
        height: 100%;
      }
      #status {
        padding: 0.35rem 1rem;
        font-size: 0.8rem;
        background: #f5f5f5;
        border-top: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <header>
      先启动 <code>packages/lsp-ws-server</code>（默认 <code>8080</code>），再运行本页。WebSocket：
      <code id="ws-label"></code> — 组件会自动附加 <code>?language=</code> 与编辑器语言一致。
    </header>
    <div id="editor-wrap">
      <code-editor
        id="editor"
        language="typescript"
        lsp-url="ws://127.0.0.1:8080/lsp"
        value="const n: number = 1;&#10;// 故意类型错误：&#10;const x: string = n;&#10;"
      ></code-editor>
    </div>
    <div id="status">诊断: — | 光标: —</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
