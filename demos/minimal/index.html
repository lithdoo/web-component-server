<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minimal code-editor + LSP</title>
    <!--
      须从「仓库根目录」起静态服务，否则下面 /packages/... 无法解析。示例：
        npx --yes serve . -l 5175
      然后打开 http://localhost:5175/demos/minimal/index.html
    -->
    <link
      rel="stylesheet"
      href="/packages/web-editor-component/dist/web-editor-component.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      code-editor {
        display: block;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <code-editor
      id="demo-editor"
      language="typescript"
      lsp-url="ws://localhost:3000/lsp"
      file-path="apps/demo/src/main.ts"
      value="// 正在加载 apps/demo/src/main.ts …"
    ></code-editor>
    <script type="module">
      await import('/packages/web-editor-component/dist/web-editor-component.js');
      const el = document.getElementById('demo-editor');
      if (!el) throw new Error('demo-editor missing');
      const res = await fetch('/apps/demo/src/main.ts');
      if (!res.ok) {
        el.value = `// 无法加载 /apps/demo/src/main.ts（HTTP ${res.status}）\n// 请从仓库根目录起静态服务（见 start-demo.bat）`;
      } else {
        el.value = await res.text();
      }
    </script>
  </body>
</html>
